name: Dependency review

# #97: block PRs that add dependencies with high/critical advisories (needs the Dependency graph).
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Permissive licenses only, checked against the full frontend tree (license-checker and the
          # Dependency graph SBOM). MPL-2.0 is only for lightningcss (build tool via vite/tailwind, dev only);
          # CC-BY-4.0 is only for caniuse-lite's data (dev only). uri-js's package.json says BSD-2-Clause, but
          # GitHub's license data (which this action checks) reports "BSD-2-Clause AND BSD-2-Clause-Views",
          # so BSD-2-Clause-Views stays until that metadata changes.
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause, ISC, 0BSD,
            BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, MPL-2.0
