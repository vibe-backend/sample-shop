name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build & push ${{ matrix.component }} image to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Detect Dockerfile
        id: detect
        run: echo "present=${{ hashFiles(format('{0}/Dockerfile', matrix.component)) != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present != 'true'
        run: echo "::notice::No Dockerfile yet; CD skipped."
      - if: steps.detect.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vibe-backend/sample-shop-${{ matrix.component }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - if: steps.detect.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.detect.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.detect.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
