name: Dependency audit

# #97: dependency vulnerability checks, since Dependabot ignores several majors.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC (10:17 HKT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review (new deps in this PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      # Blocking: anything that ships to the browser must have no high/critical advisories.
      - name: Production dependencies (blocking, high+)
        run: npm audit --omit=dev --audit-level=high
      # Report-only until the vite/vitest upgrade (#83) clears the known dev-tooling advisories.
      - name: All dependencies incl. dev (report only)
        run: |
          if npm audit --audit-level=high > audit.txt 2>&1; then
            echo "No high/critical advisories." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::High/critical advisories in dev dependencies (tracked in #83); see the job summary."
            { echo '### npm audit (all dependencies)'; echo '```'; tail -n 40 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
