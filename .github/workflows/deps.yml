name: Dependency audit

# #97: dependency vulnerability checks, since Dependabot ignores several majors.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC (10:17 HKT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR-level dependency review (actions/dependency-review-action) lives in dependency-review.yml.
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      # Blocking: anything that ships to the browser must have no high/critical advisories.
      - name: Production dependencies (blocking, high+)
        run: npm audit --omit=dev --audit-level=high
      # Report-only until the remaining shadcn CLI chain advisories (braces/micromatch) are cleared (#106).
      - name: All dependencies incl. dev (report only)
        run: |
          if npm audit --audit-level=high > audit.txt 2>&1; then
            echo "No high/critical advisories." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::High/critical advisories in dev dependencies (tracked in #106); see the job summary."
            { echo '### npm audit (all dependencies)'; echo '```'; tail -n 40 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
