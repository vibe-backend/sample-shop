name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  VIBE_VERSION: v1.0.0-rc.9
  VIBE_SHA256SUMS_SHA256: 21666579993f372880d1da5d8ef6bbdfca3f55a8b1cc8af8e6d0b89eea1c1afb

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Markdown lint & link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  app:
    name: ${{ matrix.component }} lint / test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect project type
        id: detect
        run: |
          d=${{ matrix.component }}
          echo "node=${{ hashFiles(format('{0}/package.json', matrix.component)) != '' }}" >> "$GITHUB_OUTPUT"
          echo "rust=${{ hashFiles(format('{0}/Cargo.toml', matrix.component)) != '' }}" >> "$GITHUB_OUTPUT"
          [ -d "$d" ] || echo "::notice::$d/ does not exist yet; skipping."
      # Node (e.g. static frontend tooling)
      - if: steps.detect.outputs.node == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.component }}/package.json
      - if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.component }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.component }}/pnpm-lock.yaml
      - if: steps.detect.outputs.node == 'true'
        working-directory: ${{ matrix.component }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run --if-present lint
          pnpm run --if-present test
      # Rust (backend using the SDK)
      - if: steps.detect.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, no release tags)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - if: steps.detect.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.component }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - if: steps.detect.outputs.rust == 'true'
        working-directory: ${{ matrix.component }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  docker:
    name: Docker build ${{ matrix.component }} (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Dockerfile
        id: detect
        run: echo "present=${{ hashFiles(format('{0}/Dockerfile', matrix.component)) != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.detect.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.component) || '' }}
      - if: steps.detect.outputs.present != 'true'
        run: echo "No ${{ matrix.component }}/Dockerfile yet; skipping."

  backend-lint-test:
    name: Backend lint and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with fake provider
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 "https://github.com/vibe-backend/sdk/releases/download/${VIBE_VERSION}/SHA256SUMS" -o SHA256SUMS
          printf '%s  SHA256SUMS\n' "$VIBE_SHA256SUMS_SHA256" | sha256sum -c -
          curl -fsSL "https://raw.githubusercontent.com/vibe-backend/sdk/${VIBE_VERSION}/scripts/vibe-install.sh" -o vibe-install.sh
          sh vibe-install.sh install --version "$VIBE_VERSION"
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          scaffolding=$(find . \( -name '_project.md' -o -name '_definition.md' -o -name '_version.md' \))
          if [ -n "$scaffolding" ]; then
            printf '%s\n' "$scaffolding"
            exit 1
          fi
          for banned in providers migrations fixtures; do
            if [ -e "$banned" ]; then
              printf 'unexpected %s\n' "$banned"
              exit 1
            fi
          done
          if git ls-files | grep -E '(^|/)([^/]*\.lock\.md|vibe\.lock|manifest\.json)$'; then
            exit 1
          fi
          LLM_PROVIDER=fake vibe build --check
          LLM_PROVIDER=fake vibe build 2>&1 | tee /tmp/vibe-build.log
          grep -q 'validation ok' /tmp/vibe-build.log
          while IFS= read -r -d '' lock; do
            {
              printf '### %s\n\n```markdown\n' "$lock"
              cat "$lock"
              printf '\n```\n\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(git ls-files -z -o --ignored --exclude-standard -- '*.lock.md')

  backend-build-scan:
    name: Backend build, smoke test, and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build keyless test image
        run: docker build --build-arg VIBE_VERSION --build-arg VIBE_SHA256SUMS_SHA256 -t sample-shop:ci backend
      - name: Shop API smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name shop -p 8080:8080 sample-shop:ci
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then docker logs shop; fi
            docker rm -f shop >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT
          B=http://127.0.0.1:8080
          ready=false
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /tmp/health-body -w '%{http_code}' "$B/health" || true)
            if [ "$status" = 200 ]; then
              ready=true
              break
            fi
            sleep 1
          done
          "$ready" || { printf 'health not ready: %s\n' "$(cat /tmp/health-body 2>/dev/null || true)"; exit 1; }
          expect() {
            local method=$1 url=$2 want=$3 filter=$4
            shift 4
            local status
            status=$(curl -sS -o /tmp/api-body -w '%{http_code}' -X "$method" "$@" "$url")
            printf '%s %s: %s %s\n' "$method" "$url" "$status" "$(cat /tmp/api-body)"
            [ "$status" = "$want" ]
            jq -e "$filter" /tmp/api-body >/dev/null
          }
          # Runtime route is /health ({"status":"ok"}). /healthz is not served.
          expect GET "$B/health" 200 '.status == "ok"'
          expect GET "$B/api/catalog/v1/products" 200 '.items | type == "array" and length > 0'
          expect POST "$B/api/users/v1/login" 200 '.access_token | type == "string" and length > 0' \
            -H 'Content-Type: application/json' \
            -d '{"email":"alice@example.com","password":"password123"}'
          token=$(jq -er '.access_token' /tmp/api-body)
          expect GET "$B/api/users/v1/me" 200 '.email == "alice@example.com"' \
            -H "Authorization: Bearer $token"
          product=$(curl -sS "$B/api/catalog/v1/products" | jq -er '.items[0].id')
          expect POST "$B/api/shop/v1/cart-items" 200 '(.items | type == "array" and length > 0) and (.subtotal_cents | type == "number")' \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg id "$product" '{product_id:$id, quantity:1}')"
          item=$(jq -er '.items[0].id' /tmp/api-body)
          expect POST "$B/api/shop/v1/addresses" 201 '.id | type == "string" and length > 0' \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"recipient":"Alice","phone":"91234567","region":"香港島","line1":"1 Home"}'
          address=$(jq -er '.id' /tmp/api-body)
          expect POST "$B/api/shop/v1/orders" 201 '.id | type == "string" and length > 0' \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: smoke-order-1' \
            -d "$(jq -nc --arg address "$address" --arg item "$item" '{address_id:$address, item_ids:[$item]}')"
          order=$(jq -er '.id' /tmp/api-body)
          expect POST "$B/api/shop/v1/orders/${order}/payments" 200 '.status == "paid"' \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: smoke-pay-1' \
            -d '{"method":"mock_card","simulate":"success"}'
      - name: Scan all image layers and configuration
        shell: bash
        run: |
          set -euo pipefail
          docker save sample-shop:ci -o image.tar
          scan=$(mktemp -d)
          trap 'rm -rf "$scan"' EXIT
          mkdir "$scan/archive" "$scan/layers"
          tar -xf image.tar -C "$scan/archive"
          layers=0
          for layer in "$scan"/archive/blobs/sha256/* "$scan"/archive/*/layer.tar; do
            [ -f "$layer" ] || continue
            if ! tar -tf "$layer" > "$scan/entries" 2>/dev/null; then continue; fi
            layers=$((layers + 1))
            for name in signing.key .env llm_api_key; do
              count=$(awk -F/ -v name="$name" '$NF == name { n++ } END { print n+0 }' "$scan/entries")
              printf '%s entries: %s\n' "$name" "$count"
              [ "$count" -eq 0 ] || exit 1
            done
            # Keep each layer separate so later whiteouts/overwrites cannot hide secrets.
            mkdir "$scan/layers/$layers"
            tar -xf "$layer" -C "$scan/layers/$layers"
          done
          [ "$layers" -gt 0 ]
          grep -raEl 'sk-[A-Za-z0-9_-]{20,}|LLM_API_KEY=' "$scan/layers" >> "$scan/matches" || { status=$?; [ "$status" -eq 1 ] || exit "$status"; }
          # Debian base binaries such as /usr/bin/sqv embed the PEM header literal; real PEM keys are text files
          grep -rIlE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' "$scan/layers" >> "$scan/matches" || { status=$?; [ "$status" -eq 1 ] || exit "$status"; }
          find "$scan/layers" -type f \( -name "*.key" -o -name "*.pem" \) -print >> "$scan/matches"
          if [ -s "$scan/matches" ]; then
            cat "$scan/matches"
            exit 1
          else
            printf 'Layers scanned: %s\n' "$layers"
          fi
          docker history --no-trunc --format '{{.CreatedBy}}' sample-shop:ci > "$scan/history"
          if grep -qE 'LLM_API_KEY|llm_api_key=|sk-[A-Za-z0-9]' "$scan/history"; then
            printf '%s\n' 'Forbidden value in image history'
            exit 1
          fi
          docker image inspect --format '{{json .Config.Env}}' sample-shop:ci > "$scan/env.json"
          jq -e 'all(.[]; startswith("LLM_") | not) and (index("VIBE_ALLOW_TEST_BUILD=1") != null)' "$scan/env.json" >/dev/null
          test "$(docker image inspect --format '{{.Config.User}}' sample-shop:ci)" = 10001
