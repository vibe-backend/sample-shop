version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Must stay before the catch-all `npm` group: Dependabot uses the first matching group.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      # Also before the catch-all: ESLint core, configs and plugins move together.
      eslint:
        # typescript is here so it moves with typescript-eslint, whose peer range gates TS majors (#94).
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "typescript"]
        update-types: ["minor", "patch"]
      # vite + vitest + their official plugins (incl. @vitejs/plugin-react) upgrade together (#83).
      # Before the catch-all; plugin-react matches no earlier group, so it lands here only.
      vite:
        patterns: ["vite", "vitest", "@vitejs/*", "@vitest/*"]
        update-types: ["minor", "patch"]
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @types/node's major must track the actual Node runtime (CI node-version / .nvmrc, and any
      # engines field), not the latest release. Bump it by hand with the runtime (#87).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 waits for typescript-eslint support (#94); remove after #94.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
