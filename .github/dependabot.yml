version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Hold @vitejs/plugin-react majors until vite/vitest are upgraded together (#83).
      # Remove this ignore once #83 is done. Minor and patch updates still flow.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
